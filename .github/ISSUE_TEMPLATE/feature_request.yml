name: Feature or workflow change
description: Describe the workshop problem and observable acceptance criteria.
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Who needs what, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include offline behavior, roles, audit and existing records when applicable.
    validations:
      required: true
